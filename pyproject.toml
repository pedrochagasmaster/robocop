[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch"
version = "1.1.0"
description = "Server-side TUI for launching Impala jobs through the Hadoop Query Launcher orchestrators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual==8.2.5",
  "sqlglot==30.12.0",
]

[project.optional-dependencies]
# Loading a Job's Result into a DataFrame is optional: Analysts get pandas from
# the shared runtime or not at all, and dispatch.results degrades to rows().
notebook = [
  "pandas>=1.5",
]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-xdist>=3.6,<4",
  "ruff",
  "mypy",
  "pandas>=1.5",
]
release = [
  "edge-deploy-core @ git+https://github.com/pedrochagasmaster/edge-deploy-core.git@v1.6.0",
]

[tool.uv]
required-version = "==0.12.0"
# Corporate workstations trust the HTTPS inspection issuer via the OS store.
system-certs = true
# The shared uv cache and project environments can live on different drives.
link-mode = "copy"

[project.scripts]
dispatch = "dispatch.__main__:main"

[tool.setuptools.packages.find]
include = ["dispatch*"]

[tool.setuptools.package-data]
dispatch = ["*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scr", "vendor", "tools/prod_tui", "mocks"]

[tool.ruff.lint]
# Start conservative: real errors + obvious style, not the full default set
# that churns the codebase. Expand later once the baseline is clean.
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter; keep to avoid noise

[tool.pytest.ini_options]
testpaths = ["tests", "tools/prod_tui/tests"]

[tool.ruff.lint.per-file-ignores]
# `scr/` is production-sensitive and intentionally not part of the broad
# style/upgrade gate yet. Keep correctness coverage without import churn.
"scr/*.py" = ["I001", "UP", "W"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
platform = "linux"
packages = ["dispatch"]
exclude = ["scr/", "tools/prod_tui/", "mocks/"]
ignore_missing_imports = true
# Start non-strict: catch real type errors without forcing annotations on
# every function. The initial baseline also suppresses current TypedDict/Textual
# precision gaps so this gate can land without behavioral rewrites.
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
disable_error_code = ["arg-type", "assignment", "attr-defined", "list-item", "typeddict-item"]

[[tool.mypy.overrides]]
# pandas is an optional import in dispatch.results. Its numpy stubs need
# python_version >= 3.12 to parse, so type-check against the interface we use
# rather than following into the installed package.
module = [
  "pandas.*",
  "numpy.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
  "dispatch.sql",
  "dispatch.jobs",
  "dispatch.manifest",
]
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = []
