name: Temporary PR 75 CI repair

on:
  push:
    branches: [perf/ssh-interaction-latency]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/ssh-interaction-latency
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - name: Install dev dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Repair debounce contract and worker teardown
        shell: python
        run: |
          from pathlib import Path

          path = Path("dispatch/screens/new_job.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from datetime import date, datetime\nfrom pathlib import Path\n",
                  "from datetime import date, datetime\nfrom functools import partial\nfrom pathlib import Path\n",
              ),
              (
                  "    def _update_validation_summary(self) -> None:\n        self._apply_validation_summary(self._validation_issues(), self._current_analysis())\n",
                  "    def _update_validation_summary(self) -> None:\n        self._start_validation_worker()\n",
              ),
              (
                  "    def _schedule_validation_summary(self, *, delay: float = 0.15) -> None:\n        self._live_validation_generation += 1\n        if self._validation_summary_timer is not None:\n            self._validation_summary_timer.stop()\n        self._validation_summary_timer = self.set_timer(delay, self._start_validation_worker)\n",
                  "    def _schedule_validation_summary(self, *, delay: float = 0.2) -> None:\n        self._live_validation_generation += 1\n        if self._validation_summary_timer is not None:\n            self._validation_summary_timer.stop()\n        self._validation_summary_timer = self.set_timer(delay, self._update_validation_summary)\n",
              ),
              (
                  "        self.run_worker(\n            self._refresh_validation_async(\n                generation,\n                inputs,\n                custom_schema_choice,\n                custom_schema,\n                ttl,\n                sql_cache_key,\n                cached_sql,\n            ),\n            name=\"new-job-live-validation\",\n",
                  "        self.run_worker(\n            partial(\n                self._refresh_validation_async,\n                generation,\n                inputs,\n                custom_schema_choice,\n                custom_schema,\n                ttl,\n                sql_cache_key,\n                cached_sql,\n            ),\n            name=\"new-job-live-validation\",\n",
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old[:80], text.count(old))
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - name: Format
        run: uv run --locked --no-sync ruff format dispatch/screens/new_job.py
      - name: Focused regression checks
        run: >-
          uv run --locked --no-sync python -m pytest
          tests/test_new_features.py::TestNewJobInlineValidation::test_validation_summary_is_debounced_during_typing
          tests/test_tui_performance.py::test_browser_toggle_patches_cell_without_rebuilding_table
          tests/test_tui_performance.py::test_log_search_coalesces_rapid_repaints
          tests/test_tui_performance.py::test_new_job_validation_worker_ignores_stale_result
          tests/test_new_job_queue.py
          -q -W error::RuntimeWarning
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dispatch/screens/new_job.py
          git commit -m "fix(tui): preserve debounce contract without blocking validation"
          git push origin HEAD:perf/ssh-interaction-latency
