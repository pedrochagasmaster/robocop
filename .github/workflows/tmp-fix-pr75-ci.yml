name: Temporary PR 75 CI repair

on:
  push:
    branches: [perf/ssh-interaction-latency]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/ssh-interaction-latency
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - name: Install dev dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Repair debounce contract and worker teardown
        shell: python
        run: |
          from pathlib import Path

          path = Path("dispatch/screens/new_job.py")
          text = path.read_text(encoding="utf-8")

          old = '''    def _update_validation_summary(self) -> None:
              self._apply_validation_summary(self._validation_issues(), self._current_analysis())
          '''
          new = '''    def _update_validation_summary(self) -> None:
              self._start_validation_worker()
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''    def _schedule_validation_summary(self, *, delay: float = 0.15) -> None:
              self._live_validation_generation += 1
              if self._validation_summary_timer is not None:
                  self._validation_summary_timer.stop()
              self._validation_summary_timer = self.set_timer(delay, self._start_validation_worker)
          '''
          new = '''    def _schedule_validation_summary(self, *, delay: float = 0.2) -> None:
              self._live_validation_generation += 1
              if self._validation_summary_timer is not None:
                  self._validation_summary_timer.stop()
              self._validation_summary_timer = self.set_timer(delay, self._update_validation_summary)
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''        self.run_worker(
              self._refresh_validation_async(
          '''
          new = '''        self.run_worker(
              lambda: self._refresh_validation_async(
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
      - name: Format
        run: uv run --locked --no-sync ruff format dispatch/screens/new_job.py
      - name: Focused regression checks
        run: >-
          uv run --locked --no-sync python -m pytest
          tests/test_new_features.py::TestNewJobInlineValidation::test_validation_summary_is_debounced_during_typing
          tests/test_tui_performance.py
          tests/test_new_job_queue.py
          -q -W error::RuntimeWarning
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- dispatch/screens/new_job.py; then
            echo "No repair diff produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dispatch/screens/new_job.py
          git commit -m "fix(tui): preserve debounce contract without blocking validation"
          git push origin HEAD:perf/ssh-interaction-latency
