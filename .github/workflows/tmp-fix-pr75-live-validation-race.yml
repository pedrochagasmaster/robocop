name: Temporary PR 75 live-validation race repair

on:
  push:
    branches: [perf/ssh-interaction-latency]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/ssh-interaction-latency
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - name: Install dev dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Repair explicit-message and teardown races
        shell: python
        run: |
          from pathlib import Path

          path = Path("dispatch/screens/new_job.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from textual.containers import Horizontal, Vertical\nfrom textual.screen import Screen\n",
                  "from textual.containers import Horizontal, Vertical\nfrom textual.css.query import NoMatches\nfrom textual.screen import Screen\n",
              ),
              (
                  '''    def on_unmount(self) -> None:\n        if self._validation_summary_timer is not None:\n            self._validation_summary_timer.stop()\n            self._validation_summary_timer = None\n''',
                  '''    def on_unmount(self) -> None:\n        self._invalidate_live_validation()\n''',
              ),
              (
                  '''    def _schedule_validation_summary(self, *, delay: float = 0.2) -> None:\n        self._live_validation_generation += 1\n        if self._validation_summary_timer is not None:\n            self._validation_summary_timer.stop()\n        self._validation_summary_timer = self.set_timer(delay, self._update_validation_summary)\n\n    def _start_validation_worker(self) -> None:\n''',
                  '''    def _schedule_validation_summary(self, *, delay: float = 0.2) -> None:\n        self._live_validation_generation += 1\n        if self._validation_summary_timer is not None:\n            self._validation_summary_timer.stop()\n        self._validation_summary_timer = self.set_timer(delay, self._update_validation_summary)\n\n    def _invalidate_live_validation(self) -> None:\n        self._live_validation_generation += 1\n        if self._validation_summary_timer is not None:\n            self._validation_summary_timer.stop()\n            self._validation_summary_timer = None\n\n    def _start_validation_worker(self) -> None:\n''',
              ),
              (
                  '''        if generation != self._live_validation_generation or not self.is_mounted:\n            return\n        if self._launch_inputs() != inputs or self.kerberos_ttl != ttl:\n            return\n        if file_exists is not None:\n            self._sql_exists_cache = (inputs.sql_path, file_exists)\n        if (\n            detected_source in {"SqlTemplate", "ExistingTable"}\n            and detected_source != inputs.source_type\n        ):\n            self._apply_detected_source(detected_source)\n            return\n        self._sql_analysis_cache = (sql_cache_key, sql_result)\n        if detected_source is not None:\n            self._apply_detected_source(detected_source)\n        self._inline_validate()\n        self._refresh_path_hint()\n        self._apply_validation_summary(issues, analysis)\n''',
                  '''        if generation != self._live_validation_generation or not self.is_mounted:\n            return\n        if self.kerberos_ttl != ttl:\n            return\n        try:\n            if file_exists is not None:\n                self._sql_exists_cache = (inputs.sql_path, file_exists)\n            if (\n                detected_source in {"SqlTemplate", "ExistingTable"}\n                and detected_source != inputs.source_type\n            ):\n                self._apply_detected_source(detected_source)\n                return\n            self._sql_analysis_cache = (sql_cache_key, sql_result)\n            if detected_source is not None:\n                self._apply_detected_source(detected_source)\n            self._inline_validate()\n            self._refresh_path_hint()\n            self._apply_validation_summary(issues, analysis)\n        except NoMatches:\n            return\n''',
              ),
              (
                  '''    def _show_message(self, text: str, severity: str = "info") -> None:\n        widget = self.query_one("#warning-text", Static)\n''',
                  '''    def _show_message(self, text: str, severity: str = "info") -> None:\n        self._invalidate_live_validation()\n        widget = self.query_one("#warning-text", Static)\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old[:100], count)
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - name: Format and lint
        run: |
          uv run --locked --no-sync ruff format dispatch/screens/new_job.py
          uv run --locked --no-sync ruff check dispatch/screens/new_job.py
      - name: Focused regression checks
        run: >-
          uv run --locked --no-sync python -m pytest
          tests/test_phase1_safety.py::test_sql_preview_missing_file_shows_actionable_error
          tests/test_qa_fixes.py::test_launch_blocks_invalid_email
          tests/test_qa_fixes.py::test_preview_bad_template_dates_does_not_crash
          tests/test_new_features.py::TestNewJobInlineValidation::test_validation_summary_is_debounced_during_typing
          tests/test_tui_performance.py
          tests/test_advisor_ui.py
          tests/test_new_job_queue.py
          -q -W error::RuntimeWarning
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dispatch/screens/new_job.py
          git commit -m "fix(tui): keep live validation from overwriting actions"
          git push origin HEAD:perf/ssh-interaction-latency
